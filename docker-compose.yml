services:
  postgres:
    image: postgres:16-alpine
    container_name: aggregation-postgres
    environment:
      POSTGRES_DB: db1
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d db1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: aggregation-mysql
    environment:
      MYSQL_DATABASE: db2
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: aggregation-oracle
    environment:
      ORACLE_PASSWORD: testpass
      APP_USER: testuser
      APP_USER_PASSWORD: testpass
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aggregation-app
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      oracle:
        condition: service_healthy
    environment:
      DB1_URL: jdbc:postgresql://postgres:5432/db1
      DB1_USER: testuser
      DB1_PASSWORD: testpass
      DB2_URL: jdbc:mysql://mysql:3306/db2
      DB2_USER: testuser
      DB2_PASSWORD: testpass
      DB3_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB3_USER: testuser
      DB3_PASSWORD: testpass
    ports:
      - "8080:8080"
